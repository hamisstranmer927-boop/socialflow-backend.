services:
  - type: web
    name: socialflow-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: socialflow-db
          property: connectionString
      - key: DB_DIALECT
        value: postgres
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: socialflow-db
    databaseName: socialflow
    user: socialflow
